name: Daily AI Enablement Radar

on:
  schedule:
    # Two real monitoring runs provide redundancy against delayed or skipped schedules.
    # Times are 10:47 AM and 5:47 PM IST, both safely before UTC midnight.
    - cron: "17 5 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Scheduled runs may wait while main advances.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily radar
        run: python scripts/update_radar.py

      - name: Validate generated data
        run: python scripts/validate.py

      - name: Commit monitoring record
        run: |
          git config user.name "Luke Daniel Praneeth Kumar"
          git config user.email "70698783+plukedaniel90@users.noreply.github.com"
          REPORT_DATE=$(TZ=Asia/Kolkata date +%F)
          for attempt in 1 2 3; do
            git add daily-signals data docs/data weekly-digests monthly-trends
            if git diff --cached --quiet; then
              echo "No repository change detected."
              exit 0
            fi
            git commit -m "radar: daily source check ${REPORT_DATE}"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not save the monitoring record after three attempts."
              exit 1
            fi
            # This is a disposable runner: rebuild on the latest data instead of
            # merging generated JSON or overwriting concurrent repository changes.
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_radar.py --date "$REPORT_DATE"
            python scripts/validate.py
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
